<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Room 40 Draft Dashboard</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #02233F;
    color: #ffffff;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    overflow: hidden;
  }
  #bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    background: #02233F;
    border-bottom: 1px solid #274066;
  }
  #urlInput {
    flex: 1;
    background: #0a2f52;
    border: 1px solid #274066;
    color: #ffffff;
    padding: 5px 8px;
    border-radius: 4px;
    font-size: 12px;
  }
  button {
    background: #274066;
    color: #ffffff;
    border: none;
    border-radius: 4px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  button:hover { background: #345580; }
  #frameWrap {
    position: absolute;
    top: 38px;
    left: 0;
    right: 0;
    bottom: 0;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
    background: #ffffff;
  }
  #status {
    padding: 40px 16px;
    text-align: center;
    color: #9db4d0;
    font-size: 13px;
  }
</style>
</head>
<body>
  <div id="bar">
    <input id="urlInput" type="text" placeholder="http://<pi-ip>:8877" />
    <button id="saveBtn">Save</button>
    <button id="reloadBtn">&#x21bb;</button>
  </div>
  <div id="frameWrap">
    <iframe id="dashFrame" src=""></iframe>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
